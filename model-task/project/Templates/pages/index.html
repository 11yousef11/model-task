<!DOCTYPE html>
<html>
<head>
    <title>Personal Information</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            color: #171717;
        }
        .card {
            position: relative;
            overflow: hidden;
            width: 760px;
            padding: 50px 60px;
            border-radius: 0.375rem;
            border: 1px solid #a3a3a3;
            background-color: #d4d4d4;
            box-shadow:
                inset 0 1px #ffffff,
                0 4px 6px -1px rgb(0 0 0 / 0.1),
                0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), transparent);
            pointer-events: none;
        }
        .content {
            position: relative;
        }
        h1 {
            margin: 0 0 30px 0;
            font-size: 44px;
        }
        .row {
            display: flex;
            padding: 18px 0;
            border-bottom: 1px solid #a3a3a3;
            font-size: 24px;
        }
        .row:last-child {
            border-bottom: none;
        }
        .label {
            width: 40%;
        }
        .value {
            width: 60%;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="content">
            <h1>Personal Information</h1>
            <div class="row">
                <div class="label">Full Name</div>
                <div class="value">{{ first_name|capfirst|add:" "|add:last_name }}</div>
            </div>
            <div class="row">
                <div class="label">Student ID</div>
                <div class="value">{{ student_id|stringformat:"s" }}</div>
            </div>
            <div class="row">
                <div class="label">Address</div>
                <div class="value">{{ address|upper }}</div>
            </div>
            <div class="row">
                <div class="label">Email</div>
                <div class="value">{{ email|default:"No email provided" }}</div>
            </div>
            <div class="row">
                <div class="label">Date of Birth</div>
                <div class="value">{{ dob|timesince }} ago</div>
            </div>
        </div>
    </div>
</body>
</html>
