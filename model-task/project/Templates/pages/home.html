<!DOCTYPE html>
<html>
<head>
    <title>Home Page</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 40px 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            color: #171717;
        }
        .card {
            position: relative;
            overflow: hidden;
            width: 760px;
            padding: 50px 60px;
            border-radius: 0.375rem;
            border: 1px solid #a3a3a3;
            background-color: #d4d4d4;
            box-shadow:
                inset 0 1px #ffffff,
                0 4px 6px -1px rgb(0 0 0 / 0.1),
                0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), transparent);
            pointer-events: none;
        }
        .content {
            position: relative;
        }
        h1 {
            margin: 0 0 30px 0;
            font-size: 44px;
        }
        .photo {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 0.375rem;
            border: 1px solid #a3a3a3;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            padding: 18px 0;
            border-bottom: 1px solid #a3a3a3;
            font-size: 24px;
        }
        .row:last-child {
            border-bottom: none;
        }
        .label {
            width: 40%;
        }
        .value {
            width: 60%;
            font-weight: bold;
        }
    </style>
</head>
<body>
    {% for profile in profiles %}
    <div class="card">
        <div class="content">
            <h1>Home Page</h1>
            <img class="photo" src="{{ profile.photo.url }}" alt="{{ profile.full_name }}">
            <div class="row">
                <div class="label">Full Name</div>
                <div class="value">{{ profile.full_name }}</div>
            </div>
            <div class="row">
                <div class="label">University ID</div>
                <div class="value">{{ profile.university_id }}</div>
            </div>
            <div class="row">
                <div class="label">Age</div>
                <div class="value">{{ profile.age }}</div>
            </div>
            <div class="row">
                <div class="label">Date of Birth</div>
                <div class="value">{{ profile.date_of_birth }}</div>
            </div>
            <div class="row">
                <div class="label">Address</div>
                <div class="value">{{ profile.address }}</div>
            </div>
            <div class="row">
                <div class="label">Salary</div>
                <div class="value">${{ profile.salary }}</div>
            </div>
        </div>
    </div>
    {% empty %}
    <h1>No data yet</h1>
    {% endfor %}
</body>
</html>
